<!doctype html>
<html>
  <head>

    <title>{% block title %}Real Estate{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50">
    <nav class="bg-white shadow">
