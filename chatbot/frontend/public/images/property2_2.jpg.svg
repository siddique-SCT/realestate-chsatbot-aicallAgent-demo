<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f0f0f0"/>
  <rect x="50" y="50" width="700" height="500" fill="#e0e0e0" stroke="#ccc" stroke-width="2"/>
  <rect x="100" y="150" width="550" height="300" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <text x="400" y="100" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Open Plan Living - Parklands Property</text>
  
  <!-- Floor -->
  <rect x="100" y="150" width="550" height="300" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  
  <!-- Living area -->
  <rect x="150" y="200" width="200" height="100" fill="#e6e6e6" stroke="#ddd" stroke-width="1"/>
  <rect x="170" y="220" width="160" height="60" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  <rect x="150" y="320" width="80" height="80" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  
  <!-- Dining area -->
  <circle cx="450" cy="250" r="50" fill="#e6e6e6" stroke="#ddd" stroke-width="1"/>
  <circle cx="450" cy="250" r="40" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  
  <!-- Kitchen area -->
  <rect x="400" y="320" width="200" height="80" fill="#e6e6e6" stroke="#ddd" stroke-width="1"/>
  <rect x="410" y="330" width="180" height="20" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  <rect x="410" y="360" width="40" height="30" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  <rect x="460" y="360" width="40" height="30" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  <rect x="510" y="360" width="40" height="30" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  
  <!-- Room divider -->
  <line x1="350" y1="150" x2="350" y2="450" stroke="#ddd" stroke-width="1" stroke-dasharray="5,5"/>
  
  <!-- Windows -->
  <rect x="100" y="170" width="200" height="20" fill="#d9edf7" stroke="#ccc" stroke-width="1"/>
  <rect x="500" y="170" width="150" height="20" fill="#d9edf7" stroke="#ccc" stroke-width="1"/>
  
  <text x="250" y="270" font-family="Arial" font-size="14" text-anchor="middle" fill="#555">Living Area</text>
  <text x="450" y="250" font-family="Arial" font-size="14" text-anchor="middle" fill="#555">Dining</text>
  <text x="500" y="350" font-family="Arial" font-size="14" text-anchor="middle" fill="#555">Kitchen</text>
  <text x="375" y="180" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">Open Plan Design</text>
  
  <circle cx="700" cy="550" r="30" fill="#4a90e2" opacity="0.7"/>
  <text x="700" y="555" font-family="Arial" font-size="14" text-anchor="middle" fill="#fff">2/3</text>
</svg>