<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f0f0f0"/>
  <rect x="50" y="50" width="700" height="500" fill="#e0e0e0" stroke="#ccc" stroke-width="2"/>
  <rect x="100" y="150" width="550" height="300" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <text x="400" y="100" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Master Bedroom - Clifton Property</text>
  <text x="375" y="480" font-family="Arial" font-size="18" text-anchor="middle" fill="#555">En-suite bathroom with modern fixtures</text>
  
  <!-- Bed -->
  <rect x="200" y="200" width="300" height="180" fill="#f5f5f5" stroke="#ddd" stroke-width="2"/>
  <rect x="200" y="200" width="300" height="40" fill="#e6e6e6" stroke="#ddd" stroke-width="2"/>
  <line x1="350" y1="200" x2="350" y2="240" stroke="#ddd" stroke-width="1"/>
  
  <!-- Nightstands -->
  <rect x="150" y="240" width="40" height="60" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  <rect x="510" y="240" width="40" height="60" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  
  <!-- Lamps -->
  <circle cx="170" cy="230" r="10" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <line x1="170" y1="230" x2="170" y2="250" stroke="#ccc" stroke-width="2"/>
  
  <circle cx="530" cy="230" r="10" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <line x1="530" y1="230" x2="530" y2="250" stroke="#ccc" stroke-width="2"/>
  
  <!-- Window -->
  <rect x="300" y="150" width="150" height="30" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  <line x1="325" y1="150" x2="325" y2="180" stroke="#ccc" stroke-width="1"/>
  <line x1="350" y1="150" x2="350" y2="180" stroke="#ccc" stroke-width="1"/>
  <line x1="375" y1="150" x2="375" y2="180" stroke="#ccc" stroke-width="1"/>
  <line x1="400" y1="150" x2="400" y2="180" stroke="#ccc" stroke-width="1"/>
  <line x1="425" y1="150" x2="425" y2="180" stroke="#ccc" stroke-width="1"/>
  
  <!-- Dresser -->
  <rect x="150" y="350" width="120" height="60" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  <line x1="190" y1="350" x2="190" y2="410" stroke="#ccc" stroke-width="1"/>
  <line x1="230" y1="350" x2="230" y2="410" stroke="#ccc" stroke-width="1"/>
  
  <!-- En-suite door -->
  <rect x="510" y="350" width="40" height="80" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  <circle cx="520" cy="390" r="3" fill="#555"/>
  
  <text x="350" y="300" font-family="Arial" font-size="14" text-anchor="middle" fill="#555">King-size bed</text>
  <text x="210" y="430" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">Dresser</text>
  <text x="530" y="450" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">En-suite</text>
  
  <circle cx="700" cy="550" r="30" fill="#4a90e2" opacity="0.7"/>
  <text x="700" y="555" font-family="Arial" font-size="14" text-anchor="middle" fill="#fff">3/3</text>
</svg>