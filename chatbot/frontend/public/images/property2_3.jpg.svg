<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f0f0f0"/>
  <rect x="50" y="50" width="700" height="500" fill="#e0e0e0" stroke="#ccc" stroke-width="2"/>
  <rect x="100" y="150" width="550" height="300" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <text x="400" y="100" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Garden View - Parklands Property</text>
  
  <!-- Sky -->
  <rect x="100" y="150" width="550" height="100" fill="#bbdefb" stroke="none"/>
  
  <!-- Grass -->
  <rect x="100" y="250" width="550" height="200" fill="#c8e6c9" stroke="none"/>
  
  <!-- Patio -->
  <rect x="150" y="300" width="200" height="150" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="1"/>
  
  <!-- Patio furniture -->
  <rect x="180" y="330" width="140" height="80" fill="#d9d9d9" stroke="#bdbdbd" stroke-width="1"/>
  <circle cx="200" cy="370" r="10" fill="#bdbdbd" stroke="#9e9e9e" stroke-width="1"/>
  <circle cx="300" cy="370" r="10" fill="#bdbdbd" stroke="#9e9e9e" stroke-width="1"/>
  
  <!-- Trees -->
  <circle cx="450" cy="200" r="30" fill="#81c784" stroke="#4caf50" stroke-width="1"/>
  <rect x="445" y="230" width="10" height="50" fill="#795548" stroke="none"/>
  
  <circle cx="550" cy="220" r="25" fill="#81c784" stroke="#4caf50" stroke-width="1"/>
  <rect x="545" y="245" width="10" height="40" fill="#795548" stroke="none"/>
  
  <!-- Flower beds -->
  <rect x="400" y="300" width="200" height="50" fill="#a5d6a7" stroke="#81c784" stroke-width="1"/>
  <circle cx="420" cy="325" r="8" fill="#ef9a9a" stroke="none"/>
  <circle cx="450" cy="325" r="8" fill="#ef9a9a" stroke="none"/>
  <circle cx="480" cy="325" r="8" fill="#ef9a9a" stroke="none"/>
  <circle cx="510" cy="325" r="8" fill="#ef9a9a" stroke="none"/>
  <circle cx="540" cy="325" r="8" fill="#ef9a9a" stroke="none"/>
  <circle cx="570" cy="325" r="8" fill="#ef9a9a" stroke="none"/>
  
  <!-- Garden path -->
  <path d="M250,450 C300,400 350,350 400,350" stroke="#e0e0e0" stroke-width="20" fill="none" stroke-linecap="round"/>
  
  <text x="250" y="430" font-family="Arial" font-size="14" text-anchor="middle" fill="#555">Patio Area</text>
  <text x="500" y="380" font-family="Arial" font-size="14" text-anchor="middle" fill="#555">Flower Beds</text>
  <text x="350" y="320" font-family="Arial" font-size="14" text-anchor="middle" fill="#555">Garden Path</text>
  <text x="500" y="270" font-family="Arial" font-size="14" text-anchor="middle" fill="#555">Mature Trees</text>
  
  <circle cx="700" cy="550" r="30" fill="#4a90e2" opacity="0.7"/>
  <text x="700" y="555" font-family="Arial" font-size="14" text-anchor="middle" fill="#fff">3/3</text>
</svg>