<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f0f0f0"/>
  <rect x="50" y="50" width="700" height="500" fill="#e0e0e0" stroke="#ccc" stroke-width="2"/>
  <rect x="100" y="150" width="550" height="300" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <text x="400" y="100" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Modern Kitchen - Clifton Property</text>
  <text x="375" y="300" font-family="Arial" font-size="18" text-anchor="middle" fill="#555">Kitchen with island</text>
  
  <!-- Kitchen island -->
  <rect x="300" y="250" width="150" height="80" fill="#eee" stroke="#ccc" stroke-width="2"/>
  
  <!-- Kitchen cabinets -->
  <rect x="150" y="200" width="400" height="40" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  <line x1="200" y1="200" x2="200" y2="240" stroke="#ccc" stroke-width="1"/>
  <line x1="250" y1="200" x2="250" y2="240" stroke="#ccc" stroke-width="1"/>
  <line x1="300" y1="200" x2="300" y2="240" stroke="#ccc" stroke-width="1"/>
  <line x1="350" y1="200" x2="350" y2="240" stroke="#ccc" stroke-width="1"/>
  <line x1="400" y1="200" x2="400" y2="240" stroke="#ccc" stroke-width="1"/>
  <line x1="450" y1="200" x2="450" y2="240" stroke="#ccc" stroke-width="1"/>
  <line x1="500" y1="200" x2="500" y2="240" stroke="#ccc" stroke-width="1"/>
  
  <!-- Appliances -->
  <rect x="150" y="350" width="80" height="80" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  <rect x="250" y="350" width="60" height="80" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  <rect x="500" y="350" width="80" height="80" fill="#d9d9d9" stroke="#ccc" stroke-width="1"/>
  
  <!-- Sink -->
  <rect x="330" y="350" width="100" height="60" fill="#f5f5f5" stroke="#ccc" stroke-width="1"/>
  <ellipse cx="380" cy="380" rx="30" ry="20" fill="#e6e6e6" stroke="#ccc" stroke-width="1"/>
  
  <text x="190" y="390" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">Oven</text>
  <text x="280" y="390" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">Dishwasher</text>
  <text x="380" y="420" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">Sink</text>
  <text x="540" y="390" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">Refrigerator</text>
  
  <circle cx="700" cy="550" r="30" fill="#4a90e2" opacity="0.7"/>
  <text x="700" y="555" font-family="Arial" font-size="14" text-anchor="middle" fill="#fff">2/3</text>
</svg>