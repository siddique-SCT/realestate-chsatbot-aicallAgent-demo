<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f0f0f0"/>
  <rect x="50" y="50" width="700" height="500" fill="#e0e0e0" stroke="#ccc" stroke-width="2"/>
  <rect x="100" y="150" width="550" height="300" fill="#fff" stroke="#ddd" stroke-width="2"/>
  <text x="400" y="100" font-family="Arial" font-size="24" text-anchor="middle" fill="#333">Exterior View - Parklands Property</text>
  
  <!-- House outline -->
  <polygon points="200,350 200,200 350,150 500,200 500,350" fill="#f5f5f5" stroke="#888" stroke-width="2"/>
  
  <!-- Roof -->
  <polygon points="200,200 350,100 500,200" fill="#d9d9d9" stroke="#888" stroke-width="2"/>
  
  <!-- Door -->
  <rect x="330" y="280" width="40" height="70" fill="#a67c52" stroke="#7d5a3c" stroke-width="1"/>
  <circle cx="340" cy="315" r="3" fill="#555"/>
  
  <!-- Windows -->
  <rect x="240" y="230" width="50" height="60" fill="#d9edf7" stroke="#888" stroke-width="1"/>
  <line x1="265" y1="230" x2="265" y2="290" stroke="#888" stroke-width="1"/>
  <line x1="240" y1="260" x2="290" y2="260" stroke="#888" stroke-width="1"/>
  
  <rect x="410" y="230" width="50" height="60" fill="#d9edf7" stroke="#888" stroke-width="1"/>
  <line x1="435" y1="230" x2="435" y2="290" stroke="#888" stroke-width="1"/>
  <line x1="410" y1="260" x2="460" y2="260" stroke="#888" stroke-width="1"/>
  
  <!-- Garage -->
  <rect x="200" y="300" width="80" height="50" fill="#e6e6e6" stroke="#888" stroke-width="1"/>
  <rect x="210" y="310" width="60" height="40" fill="#d9d9d9" stroke="#888" stroke-width="1"/>
  
  <!-- Garden -->
  <rect x="100" y="350" width="550" height="100" fill="#c8e6c9" stroke="#ddd" stroke-width="1"/>
  <circle cx="150" cy="380" r="10" fill="#81c784"/>
  <circle cx="180" cy="400" r="10" fill="#81c784"/>
  <circle cx="210" cy="380" r="10" fill="#81c784"/>
  <circle cx="550" cy="380" r="10" fill="#81c784"/>
  <circle cx="520" cy="400" r="10" fill="#81c784"/>
  <circle cx="490" cy="380" r="10" fill="#81c784"/>
  
  <!-- Driveway -->
  <path d="M280,350 L280,450" stroke="#bdbdbd" stroke-width="40" stroke-linecap="round"/>
  
  <text x="350" y="400" font-family="Arial" font-size="14" text-anchor="middle" fill="#555">Landscaped garden</text>
  <text x="250" y="430" font-family="Arial" font-size="12" text-anchor="middle" fill="#555">Driveway</text>
  <text x="240" y="290" font-family="Arial" font-size="10" text-anchor="middle" fill="#555">Garage</text>
  
  <circle cx="700" cy="550" r="30" fill="#4a90e2" opacity="0.7"/>
  <text x="700" y="555" font-family="Arial" font-size="14" text-anchor="middle" fill="#fff">1/3</text>
</svg>