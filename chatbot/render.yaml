services:
  # A Flask API service
  - type: web
    name: ai-call-agent-demo
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir flask_app app:create_app()
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: FLASK_ENV
        value: production
    autoDeploy: true